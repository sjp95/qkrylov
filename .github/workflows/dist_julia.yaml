name: Build and Release Julia Binaries

on:
  push:
    branches:
      - julia-release
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag name (default: latest-binaries)'
        required: false
        default: 'latest-binaries'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux-gnu
            os: ubuntu-latest
            os_name: linux
            arch: x86_64
            cuda: none
          - platform: x86_64-linux-gnu-cuda12
            os: ubuntu-latest
            os_name: linux
            arch: x86_64
            cuda: "12.0"
          - platform: aarch64-linux-gnu
            os: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
            cuda: none
          - platform: aarch64-apple-darwin
            os: macos-14
            os_name: macos
            arch: aarch64
            cuda: none
          - platform: x86_64-w64-mingw32
            os: windows-latest
            os_name: windows
            arch: x86_64
            cuda: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install libomp

      - name: Build CUDA Library in manylinux_2_28 Container (GLIBC 2.28 + Static CUDA Runtime)
        if: matrix.platform == 'x86_64-linux-gnu-cuda12'
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace quay.io/pypa/manylinux_2_28_x86_64 bash -c '
            set -e
            dnf install -y "dnf-command(config-manager)" --disablerepo=epel
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
            dnf install -y gcc-toolset-12-gcc-c++ \
              cuda-nvcc-12-6 \
              cuda-cudart-devel-12-6 \
              cuda-driver-devel-12-6 \
              cuda-cccl-12-6 \
              --disablerepo=epel

            source /opt/rh/gcc-toolset-12/enable

            # Setup CUDA environment inside container
            export CUDA_HOME=/usr/local/cuda-12.6
            export PATH="${CUDA_HOME}/bin:${PATH}"
            export LD_LIBRARY_PATH="${CUDA_HOME}/lib64:${CUDA_HOME}/lib64/stubs:${LD_LIBRARY_PATH}"

            # Link libcuda stub if needed for driver API linking
            if [ -d "${CUDA_HOME}/lib64/stubs" ] && [ ! -f "${CUDA_HOME}/lib64/libcuda.so" ]; then
              ln -sf "${CUDA_HOME}/lib64/stubs/libcuda.so" "${CUDA_HOME}/lib64/libcuda.so" || true
            fi

            # Replace dynamic libcudart.so with a symlink to libcudart_static.a
            # This satisfies CMake FindCUDAToolkit while ensuring the linker statically embeds the runtime
            ln -sf libcudart_static.a "${CUDA_HOME}/lib64/libcudart.so"
            ln -sf libcudart_static.a "${CUDA_HOME}/lib64/libcudart.so.12"

            cmake -B build -S . \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=g++ \
              -DKokkos_ENABLE_CUDA=ON \
              -DCMAKE_CUDA_HOST_COMPILER=g++ \
              -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.6/bin/nvcc \
              -DKokkos_ARCH_AMPERE80=ON \
              -DCMAKE_CUDA_FLAGS="-cudart=static -gencode arch=compute_80,code=compute_80" \
              -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--allow-shlib-undefined" \
              -DQKRYLOV_BUILD_TESTS=OFF \
              -DQKRYLOV_BUILD_EXAMPLES=OFF \
              -DQKRYLOV_BUILD_PYTHON=OFF \
              -DCMAKE_INSTALL_PREFIX=artifact_staging

            cmake --build build -j 4
            cmake --install build
            chmod -R a+rX /workspace/artifact_staging
          '

      - name: Configure and Build C++ Library (Host Platforms)
        if: matrix.platform != 'x86_64-linux-gnu-cuda12'
        shell: bash
        run: |
          EXTRA_FLAGS=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            OPENMP_PREFIX=$(brew --prefix libomp)
            EXTRA_FLAGS="-DOpenMP_ROOT=${OPENMP_PREFIX} -DCMAKE_PREFIX_PATH=${OPENMP_PREFIX}"
          fi
          EXTRA_FLAGS="${EXTRA_FLAGS} -DKokkos_ENABLE_CUDA=OFF"

          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DQKRYLOV_BUILD_TESTS=OFF \
            -DQKRYLOV_BUILD_EXAMPLES=OFF \
            -DQKRYLOV_BUILD_PYTHON=OFF \
            -DCMAKE_INSTALL_PREFIX=artifact_staging \
            $EXTRA_FLAGS
          cmake --build build --config Release -j 4
          cmake --install build --config Release

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package Artifact and Compute Tree Hash
        shell: bash
        run: |
          julia -e '
          using Tar
          Tar.create("artifact_staging", "archive.tar")
          tree_sha = Tar.tree_hash("archive.tar")
          write("tree_sha.txt", tree_sha)
          '
          python -c '
          import gzip, shutil, hashlib, json

          tarball = "qkrylov-${{ matrix.platform }}.tar.gz"
          with open("archive.tar", "rb") as f_in, gzip.open(tarball, "wb", 9) as f_out:
              shutil.copyfileobj(f_in, f_out)

          with open(tarball, "rb") as f:
              file_sha = hashlib.sha256(f.read()).hexdigest()

          with open("tree_sha.txt") as f:
              tree_sha = f.read().strip()

          meta = {
              "platform": "${{ matrix.platform }}",
              "os": "${{ matrix.os_name }}",
              "arch": "${{ matrix.arch }}",
              "cuda": "${{ matrix.cuda }}",
              "tarball": tarball,
              "sha256": file_sha,
              "git_tree_sha1": tree_sha
          }
          with open("metadata-${{ matrix.platform }}.json", "w") as f:
              json.dump(meta, f, indent=2)
          '

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: |
            qkrylov-${{ matrix.platform }}.tar.gz
            metadata-${{ matrix.platform }}.json

  publish-and-update-artifacts:
    name: Publish Release & Update Artifacts.toml
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout julia-release branch
        uses: actions/checkout@v4
        with:
          ref: julia-release
          fetch-depth: 0

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          else
            TAG_NAME="julia-latest"
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Publish Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          ARCHIVE_TAG="build-${SHORT_SHA}"

          # 1. Create an immutable historical archive for this exact build
          echo "Creating permanent archive release for $ARCHIVE_TAG..."
          gh release create "$ARCHIVE_TAG" qkrylov-*.tar.gz \
            --title "Build ${SHORT_SHA}" \
            --notes "Permanent binary archive for commit ${GITHUB_SHA} built on ${BUILD_DATE}. To install this specific build in Julia: Pkg.add(url=\"https://github.com/${{ github.repository }}.git\", rev=\"${GITHUB_SHA}\", subdir=\"bindings/julia\")" \
            --target "$GITHUB_SHA" || true

          # 2. Recreate the rolling release tag so GitHub shows "released just now"
          echo "Recreating rolling release $TAG_NAME to refresh release timestamp..."
          gh release delete "$TAG_NAME" --yes || true
          gh release create "$TAG_NAME" qkrylov-*.tar.gz \
            --title "julia-latest" \
            --notes "Automated multi-platform native binary release for QuantumKrylov Julia bindings. Updated on ${BUILD_DATE} from commit ${SHORT_SHA}. To install the latest verified build in Julia: Pkg.add(url=\"https://github.com/${{ github.repository }}.git\", rev=\"julia-latest\", subdir=\"bindings/julia\")" \
            --target "$GITHUB_SHA"

      - name: Generate Artifacts.toml
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -c '
          import os, glob, json, subprocess

          # Dynamically detect repository name without hardcoding
          repo = os.environ.get("GITHUB_REPOSITORY")
          if not repo:
              try:
                  origin = subprocess.check_output(["git", "config", "--get", "remote.origin.url"]).decode().strip()
                  repo = origin.split("github.com/")[-1].removesuffix(".git").removeprefix("git@github.com:")
              except Exception:
                  repo = "sjp95/qkrylov"

          tag = os.environ.get("TAG_NAME", "julia-latest")

          meta_files = sorted(glob.glob("metadata-*.json"))
          
          with open("Artifacts.toml", "w") as out:
              out.write(f"# Auto-generated Artifacts.toml for QuantumKrylov ({tag})\n")
              for mf in meta_files:
                  with open(mf) as f:
                      d = json.load(f)
                  tarball = d["tarball"]
                  arch = d["arch"]
                  tree_sha = d["git_tree_sha1"]
                  os_name = d["os"]
                  file_sha = d["sha256"]
                  cuda = d.get("cuda")
                  url = f"https://github.com/{repo}/releases/download/{tag}/{tarball}"

                  out.write(f"\n[[libqkrylov]]\n")
                  out.write(f"arch = \"{arch}\"\n")
                  out.write("lazy = true\n")
                  if cuda and cuda != "none":
                      out.write(f"cuda = \"{cuda}\"\n")
                  elif os_name == "linux" and arch == "x86_64":
                      out.write("cuda = \"none\"\n")
                  out.write(f"git-tree-sha1 = \"{tree_sha}\"\n")
                  out.write(f"os = \"{os_name}\"\n\n")
                  out.write(f"    [[libqkrylov.download]]\n")
                  out.write(f"    sha256 = \"{file_sha}\"\n")
                  out.write(f"    url = \"{url}\"\n")
          '
          cp Artifacts.toml bindings/julia/Artifacts.toml

      - name: Commit and Push Updated Artifacts.toml
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bindings/julia/Artifacts.toml
          if ! git diff --staged --quiet; then
            git commit -m "Update Artifacts.toml for ${TAG_NAME} [skip ci]"
            git pull --rebase origin julia-release || true
            git push origin julia-release
          else
            echo "Artifacts.toml is already up-to-date."
          fi

  test-released-artifacts:
    name: Test Released Artifacts (${{ matrix.os }})
    needs: publish-and-update-artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-14
          - os: windows-latest
    steps:
      - name: Checkout julia-release branch
        uses: actions/checkout@v4
        with:
          ref: julia-release

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Test Julia package with downloaded Artifacts
        shell: bash
        run: |
          julia --project=bindings/julia -e 'using Pkg; Pkg.test()'

  promote-verified-release:
    name: Promote Verified Release (Update julia-latest Tag)
    needs: test-released-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout julia-release branch
        uses: actions/checkout@v4
        with:
          ref: julia-release
          fetch-depth: 0

      - name: Promote julia-latest tag to verified commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERIFIED_COMMIT=$(git rev-parse HEAD)
          echo "All platform tests passed! Promoting julia-latest tag to verified commit $VERIFIED_COMMIT..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f julia-latest "$VERIFIED_COMMIT"
          git push -f origin julia-latest
          gh release edit julia-latest --target "$VERIFIED_COMMIT" || true

