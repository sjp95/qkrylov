name: Build and Publish Wheels

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0). Leave blank to auto-detect from git tag."
        required: false
        default: ""

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version string
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VER="${{ github.event.release.tag_name }}"
          else
            VER=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          fi
          VER="${VER#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build sdist
        run: |
          SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }} pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build CPU ${{ matrix.python.build }} on ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - name: windows-amd64
            os: windows-latest
            arch: AMD64
          - name: macos-arm64
            os: macos-14
            arch: arm64
          # - name: macos-x86_64
          #   os: macos-13
          #   arch: x86_64
        python:
          - build: cp311-*
            py_api: ""
            tag: cp311
          - build: cp312-*
            py_api: cp312
            tag: cp312-abi3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version string
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VER="${{ github.event.release.tag_name }}"
          else
            VER=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          fi
          VER="${VER#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for Linux ARM64
        if: matrix.platform.arch == 'aarch64' && matrix.platform.os == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3

      - name: Install macOS OpenMP
        if: startsWith(matrix.platform.os, 'macos')
        run: brew install libomp

      - name: Build CPU wheels via cibuildwheel
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: .
        env:
          CIBW_BUILD: ${{ matrix.python.build }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.platform.arch }}
          CIBW_TEST_COMMAND: "python -c \"import qkrylov; print(qkrylov.__version__)\""
          CIBW_ENVIRONMENT: >-
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}
            SKBUILD_WHEEL_PY_API=${{ matrix.python.py_api }}
          CIBW_ENVIRONMENT_MACOS: >-
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.platform.os == 'macos-14' && '14.0' || '13.0' }}
          CIBW_ENVIRONMENT_WINDOWS: >-
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}
          CMAKE_PREFIX_PATH: "/opt/homebrew/opt/libomp:/usr/local/opt/libomp"
          SKBUILD_WHEEL_PY_API: ${{ matrix.python.py_api }}

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-cpu-${{ matrix.platform.name }}-${{ matrix.python.tag }}
          path: ./wheelhouse/*.whl

  build_cuda:
    name: Build CUDA 12 ${{ matrix.python.build }} on Linux x86_64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - build: cp311-*
            tag: cp311
          - build: cp312-*
            tag: cp312

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version string
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VER="${{ github.event.release.tag_name }}"
          else
            VER=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          fi
          VER="${VER#v}"
          echo "version=$VER+cu12" >> "$GITHUB_OUTPUT"

      - name: Build CUDA wheels via cibuildwheel
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: ${{ matrix.python.build }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux_2_28_x86_64"
          # Install NVIDIA CUDA Toolkit via yum repo (only compiler + headers, no driver)
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y 'dnf-command(config-manager)' --disablerepo=epel &&
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo &&
            dnf install -y gcc-toolset-12-gcc gcc-toolset-12-gcc-c++ cuda-compiler-12-6 cuda-cudart-devel-12-6 cuda-nvcc-12-6 cuda-cccl-12-6 cuda-driver-devel-12-6 cuda-profiler-api-12-6 --disablerepo=epel &&
            echo '#!/bin/bash' > /usr/bin/nvcc && echo 'args=()' >> /usr/bin/nvcc && echo 'for arg in "$@"; do if [ "$arg" != "-Os" ]; then args+=("$arg"); fi; done' >> /usr/bin/nvcc && echo '/usr/local/cuda-12.6/bin/nvcc "${args[@]}"' >> /usr/bin/nvcc && chmod +x /usr/bin/nvcc
          CIBW_ENVIRONMENT: >-
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}
            CMAKE_ARGS="-DKokkos_ENABLE_CUDA=ON -DKokkos_ENABLE_OPENMP=ON -DKokkos_ARCH_AMPERE80=ON -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.6/bin/nvcc -DCMAKE_C_COMPILER=/opt/rh/gcc-toolset-12/root/usr/bin/gcc -DCMAKE_CXX_COMPILER=/opt/rh/gcc-toolset-12/root/usr/bin/g++ -DCMAKE_CUDA_HOST_COMPILER=/opt/rh/gcc-toolset-12/root/usr/bin/g++"
          # Tell auditwheel to NOT bundle nvidia libraries (keep wheel small)
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair --exclude libcublas.so.12 --exclude libcudart.so.12 --exclude libcuda.so.1 -w {dest_dir} {wheel}"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-cuda-${{ matrix.python.tag }}
          path: ./wheelhouse/*.whl

  publish_and_index:
    name: Publish to PyPI and Generate Index
    needs: [build_wheels, build_cuda, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qkrylov
    permissions:
      contents: write
      id-token: write
    if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Download CPU and sdist wheels for PyPI
        uses: actions/download-artifact@v4
        with:
          path: ./pypi_wheels
          pattern: cibw-wheels-{cpu,sdist}*
          merge-multiple: true

      - name: Download ALL wheels for Custom Index and Release
        uses: actions/download-artifact@v4
        with:
          path: ./wheels
          pattern: cibw-wheels-*
          merge-multiple: true

      - name: List wheels being published to PyPI
        run: ls -lh ./pypi_wheels/

      # [TEMP DISABLED] Publish to PyPI — re-enable once GH Release + gh-pages are verified working
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     packages-dir: ./pypi_wheels

      - name: Upload all wheels to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ./wheels/*.whl

      - name: Generate Custom Index (PyTorch style)
        if: github.event_name == 'release'
        run: |
          python .github/scripts/generate_indexes.py ./wheels ${{ github.repository }} ${{ github.ref_name }}

      - name: Deploy Custom Index to gh-pages branch
        if: github.event_name == 'release'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./whl_out
          destination_dir: whl
          keep_files: true
