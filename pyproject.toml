[build-system]
requires = [
    "scikit-build-core>=1.0",
    "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "qkrylov"
dynamic = ["version"]
description = "Matrix-free Krylov methods for quantum many-body physics"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Subhajyoti Pal" },
    { name = "Aritra Mukhopadhyay" },
    { name = "Pritipriya Dasbehera" },
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest",
    "scipy",
]
cuda = [
    "nvidia-cuda-runtime-cu12",
    "nvidia-cublas-cu12",
]
docs = [
    "zensical",
]

[project.urls]
Homepage = "https://github.com/sjp95/qkrylov"
Documentation = "https://sjp95.github.io/qkrylov/"
Issues = "https://github.com/sjp95/qkrylov/issues"

# -- scikit-build-core config -------------------------------------------------
[tool.scikit-build]
# CMakeLists.txt is two levels up from bindings/python/
cmake.source-dir = "."
wheel.packages = ["bindings/python/qkrylov"]

# Version comes from git tag via scikit-build-core's vcs provider.
# On a tagged commit (e.g. v0.1.0 or 0.1.0), version = "0.1.0".
# On untagged commits, uses fallback below.
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build.cmake.define]
QKRYLOV_BUILD_TESTS = "OFF"
QKRYLOV_BUILD_PYTHON = "ON"

# -- setuptools_scm config -----------------------------------------------------
[tool.setuptools_scm]
# Root is the repo root, two levels up from bindings/python/

# Strip the leading 'v' from tags (e.g. v0.1.0 -> 0.1.0)
tag_regex = "^(?:v)?(?P<version>[0-9]+(?:\\.[0-9]+)*)$"
# On a clean tagged commit, produce "0.1.0" with no dev suffix
version_scheme = "no-guess-dev"
# Fallback used only during local dev builds with no tags
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests", "bindings/python/tests"]
