hooks = ["docs_hooks.py"]
[project]
site_url = "https://sjp95.github.io/qkrylov/"
site_name = "qkrylov"
site_description = "Matrix-free quantum exact diagonalization & dynamics engine in modern C++ and Python."
repo_url = "https://github.com/sjp95/qkrylov"
repo_name = "qkrylov/qkrylov"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Quickstart" = "quickstart.md" },
    { "Building the Hamiltonian" = "getting_started/tutorial_hamiltonian/index.md" },
    { "Ecosystem Interop (NumPy/SciPy/Torch)" = "getting_started/ecosystem.md" },
    { "The SciML Workflow (Julia)" = "getting_started/sciml_julia.md" },
  ]},
  { "Examples and Benchmarks" = [
    { "Replicated Papers" = "replications.md" },
    { "Benchmarks (CPU vs GPU)" = "benchmarks.md" },
  ]},
  { "Theory of Algorithms" = [
    { "Matrix-Free SpMV on GPUs" = "theory/matrix_free_spmv.md" },
    { "Single-Pass vs Two-Pass Lanczos" = "theory/lanczos_memory.md" },
    { "Dual-Precision (FP32/FP64) Stability" = "theory/precision_stability.md" },
  ]},
  { "API Reference" = [
    { "Overview" = "api/index.md" },
    { "Python API" = "api/python.md" },
    { "Julia API" = "api/julia.md" },
    { "C++ Core API" = "api/cpp.md" },
  ]},
  { "Contributing" = "contributing.md" },
]

